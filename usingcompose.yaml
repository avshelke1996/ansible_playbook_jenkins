---

# hosts
- hosts: devmachine
  user: avi
  become: yes
  connection: ssh
  gather_facts: yes
  
  
# target
  - name: install docker
    action: dnf name=docker state=started

  - name: clonning git repo
    action: ansible.builtin.git url=https://github.com/avshelke1996/ansible_playbook_jenkins.git dest=giiit
  
  - name: create bridge network
    action: community.docker.docker_network name=avi_network driver=bridge state=present

  - name: create container with our network
    action: community.docker.docker_container name=s1_container image=tomcat state=started network_mode=avi_network published_ports=8080:8080

  - name: copying file to tomcat webapps
    action: community.docker.docker_container_copy_into "container=s1_container src=giiit/sample.war container_path=/usr/local/tomcat/webapps/sample.war"
    
