---

# hosts
- hosts: devmachine
  user: avi
  become: yes
  connection: ssh
  gather_facts: yes
  
  
# target
  - name: install docker
    action: dnf name=docker state=started
  
  - name: create bridge network
    action: community.docker.docker_network name=avi_network driver=bridge state=present

  - name: create container with our network
    action: community.docker.docker_container name=s1_container image=tomcat state=started network_mode=avi_network published_ports=8080:8080

  - name: download sample war
    action: ansible.builtin.get_url url=https://tomcat.apache.org/tomcat-6.0-doc/appdev/sample/sample.war dest=/usr/local/tomcat/webapps/sample.war
