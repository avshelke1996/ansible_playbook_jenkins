---

# hosts
- hosts: devlinux
  user: avi
  become: yes
  connection: ssh
  gather_facts: yes
  
  vars:
    pkg: docker
    path: /usr/local/tomcat/webapps/sample.war
    giturl: https://github.com/avshelke1996/ansible_playbook_jenkins.git
    
# target
  tasks:
  - name: install docker
    action: dnf name="{{pkg}}" state=present
    notify:
     - clonning_git_repo
     - create_bridge_network
     - create_container_with_our_network
     - copying_file_to_tomcat_webapps

  handlers:
  - name: clonning_git_repo
    action: ansible.builtin.git repo="{{giturl}}" dest=giiit
  
  - name: create_bridge_network
    action: community.docker.docker_network name=avi_network driver=bridge state=present

  - name: create_container_with_our_network
    action: community.docker.docker_container name=s1_container image=tomcat state=started network_mode=avi_network published_ports=8080:8080

  - name: copying_file_to_tomcat_webapps
    action: community.docker.docker_container_copy_into container=s1_container path=giiit/sample.war container_path="{{path}}"
    
